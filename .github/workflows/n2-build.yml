name: Codynex N2 Temporary Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codynex-n2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_VERSION: "9.5.0"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK: "28.2.13676358"
      ANDROID_CMAKE: "3.22.1"
      APK_PATH: "app/build/outputs/apk/debug/app-debug.apk"

    steps:
      - name: Checkout temporary builder
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Create artifact directory
        shell: bash
        run: mkdir -p artifacts

      - name: Configure host-native test
        shell: bash
        run: cmake -S host -B host/build -DCMAKE_BUILD_TYPE=Release

      - name: Build host-native test
        shell: bash
        run: cmake --build host/build --config Release --parallel 2

      - name: Run host-native N2 suite
        shell: bash
        run: |
          ./host/build/codynex_n2_host | tee artifacts/host-results.json
          jq -e '.pass == true' artifacts/host-results.json > /dev/null
          jq -e '.stageComplete == false' artifacts/host-results.json > /dev/null

      - name: Assemble Android debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: test -s "${APK_PATH}"

      - name: Verify ARM64 native library is packaged
        shell: bash
        run: unzip -l "${APK_PATH}" | grep -F "lib/arm64-v8a/libcodynex_n2.so"

      - name: Verify ARM32 native library is packaged
        shell: bash
        run: unzip -l "${APK_PATH}" | grep -F "lib/armeabi-v7a/libcodynex_n2.so"

      - name: Extract packaged native libraries
        shell: bash
        run: |
          unzip -p "${APK_PATH}" lib/arm64-v8a/libcodynex_n2.so \
            > artifacts/libcodynex_n2-arm64-v8a.so
          unzip -p "${APK_PATH}" lib/armeabi-v7a/libcodynex_n2.so \
            > artifacts/libcodynex_n2-armeabi-v7a.so

      - name: Verify native ELF architectures
        shell: bash
        run: |
          readelf -h artifacts/libcodynex_n2-arm64-v8a.so \
            | tee artifacts/elf-arm64.txt
          readelf -h artifacts/libcodynex_n2-armeabi-v7a.so \
            | tee artifacts/elf-arm32.txt
          grep -Eq 'Machine:.*AArch64' artifacts/elf-arm64.txt
          grep -Eq 'Class:.*ELF32' artifacts/elf-arm32.txt
          grep -Eq 'Machine:.*ARM' artifacts/elf-arm32.txt

      - name: Copy APK and capture APK contents
        shell: bash
        run: |
          cp "${APK_PATH}" artifacts/codynex-n2-debug.apk
          unzip -l "${APK_PATH}" > artifacts/apk-contents.txt

      - name: Generate SHA-256 evidence
        shell: bash
        run: |
          sha256sum \
            artifacts/codynex-n2-debug.apk \
            artifacts/libcodynex_n2-arm64-v8a.so \
            artifacts/libcodynex_n2-armeabi-v7a.so \
            artifacts/host-results.json \
            > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload disposable N2 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: codynex-n2-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
